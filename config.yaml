# TradingCat 交易系统 — 配置模板
# =====================================================================
# 使用方式：
#   1. 复制为本地文件（如 ~/.tradingcat/config.yaml）并按需修改；
#   2. 密钥一律走环境变量引用（${VAR}），本文件不硬编码任何密钥；
#   3. 运行前先加载环境变量（见 .env.example 与 docs/deploy.md）。
# 校验：python3 -c "import yaml; yaml.safe_load(open('config.yaml'))"
#
# 说明：非敏感运行参数由 shared.config.TradingCatConfig 统一加载。
# =====================================================================

# ── 长桥数据源（唯一行情/券商源）──────────────────────────────
# 凭证引用环境变量，变量名与代码实际读取一致（见
# shared/longbridge_client.py / production/subscribe.py / shared/db.py）。
# 部署时导出真实 LONGBRIDGE_* 变量，密钥不写入本文件。
market:
  longbridge:
    app_key: ${LONGBRIDGE_APP_KEY}       # 长桥开放平台 App Key
    app_secret: ${LONGBRIDGE_APP_SECRET} # 长桥开放平台 App Secret
    access_token: ${LONGBRIDGE_ACCESS_TOKEN}  # Legacy API Key token（不是 CLI OAuth token）
    http_url: ${LONGBRIDGE_HTTP_URL:-}   # 可选官方端点覆盖；不读取 LONGBRIDGE_REGION
    # 生产最小权限可改用 QUOTE_*/TRADE_* 两套环境变量，并开启强制隔离。
    require_separate_credentials: ${TRADINGCAT_REQUIRE_SEPARATE_CREDENTIALS:-0}

  fundamentals:
    primary: auto                       # SDK 0.2.74 无基本面接口；按能力探测并安全降级
    openalice_adapter_command: ${TRADINGCAT_OPENALICE_ADAPTER_COMMAND:-}

database:
  core_path: shared/trading.db
  execution_path: shared/execution.db

quota:
  longbridge_daily: 1000

# ── 推送 ─────────────────────────────────────────────────────────────
# 订阅报告 webhook；未设置则不推送，只落盘 reports/YYYY-MM-DD/
webhook:
  url: ${TRADINGCAT_WEBHOOK_URL:-}
  notification_url: ${TRADINGCAT_NOTIFICATION_WEBHOOK:-}

approval:
  # LIVE 只能由独立 executiond 验证 ApprovalProof；CLI 精确短语不能 mint APPROVED。
  identity_secret: ${TRADINGCAT_APPROVAL_IDENTITY_SECRET:-}
  owner_map: ${TRADINGCAT_APPROVAL_OWNER_MAP:-}

# ── 订阅 / 监听 ──────────────────────────────────────────────────────
# 日频报告模式（tc subscribe add/list/rm/run），对齐盘前/盘中/盘后工作流
subscription:
  store: state_repository              # watchlist_item + monitoring_subscription
  push_daily: true                     # 默认开启每日推送

report:
  directory: reports
  backup_directory: data/backups

runtime:
  root: ${TRADINGCAT_RUNTIME_DIR:-}     # 安装部署时的可写运行目录
  reports: ${TRADINGCAT_REPORTS_DIR:-}
  backups: ${TRADINGCAT_BACKUP_DIR:-}

# ── 监控三态 ─────────────────────────────────────────────────────────
# 盘前 pre / 盘中 intra / 盘后 post（tc monitor pre|intra|post）
monitor:
  scope: portfolio                     # portfolio | watchlist（watchlist 读订阅清单）
  critical_distance_pct: 1.0           # 临界预警阈值（距边界/止损 ≤1%）

# ── 研究流水线 ───────────────────────────────────────────────────────
# tc research run SYMBOL [--grid full|small|adx]
research:
  grid: full                           # full=1620 组 | small=9 组 | adx=1620 组+ADX 过滤
  min_bars: 630                        # 504 根开发区 + 至少 126 根 Final Holdout
  prefilter_min_bars: 504
  longbridge_quant: optional_research_only # 不替代 Native 最终验证
